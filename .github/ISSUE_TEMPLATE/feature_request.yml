name: Feature request
description: Suggest a new mechanism, engine, API or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it look from the user's side? A code sketch of the API helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and references
      description: Workarounds you use now, other libraries that do it, papers.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md).
