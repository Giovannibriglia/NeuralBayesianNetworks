name: CI

# Lanes (markers are declared in pyproject.toml, wired in tests/conftest.py):
#
#   lint        Linux CPU, py3.12        environment check, ruff, mypy (once)
#   test        Linux CPU, py3.10/3.14   the fast gate = pytest's default
#                                         selection (not slow / subprocess /
#                                         network / perf / cuda / multi_gpu),
#                                         on the oldest and newest supported
#                                         Python
#   bench       Linux CPU, py3.12        slow + subprocess tests (real cell
#                                         workers, the nbn-bench CLI) and the
#                                         benchmark smoke runs
#   macos       macOS arm64 (MPS)        the fast gate on a real Metal device,
#                                         then the mps-marked tests with the
#                                         CPU fallback disabled
#   notebooks   Linux CPU, py3.12        executes the notebooks in examples/
#                                         (pytest --nbmake)
#   docs        Linux CPU, py3.12        builds the documentation site with
#                                         warnings as errors (as Read the Docs
#                                         does, from .readthedocs.yaml)
#
# Elsewhere: the network-marked tests (bnlearn downloads) and the full suite
# run in nightly.yml; CUDA runs by hand in gpu.yml (self-hosted runner).
#
# Triggers: pull requests, pushes to master, and by hand. Pushes to other
# branches do not run CI on their own (open a PR), so a PR commit runs once.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older one on a PR branch; on master every
  # merge is tested to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Check environment
        # The resolver's picks must satisfy the versions the adapters are
        # written against (nbn/bench/_env.py mirrors pyproject.toml).
        run: nbn-bench check-env

      - name: Lint
        run: ruff check nbn/ tests/ examples/ scripts/

      - name: Type-check core
        run: mypy nbn/core nbn/mechanisms

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and newest released Python.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Test (fast gate)
        # The default selection; torch's thread pool is pinned per xdist
        # worker in tests/conftest.py.
        run: pytest -n auto

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Slow and subprocess tests
        # Excludes the network / perf / device lanes; loadgroup honours any
        # xdist_group a test declares.
        run: >
          pytest -n auto --dist loadgroup
          -m "(slow or subprocess) and not network and not perf and not cuda and not multi_gpu"

      - name: Parameter-learning smoke
        run: nbn-bench param-learning --config nbn/bench/configs/synthetic/smoke_tests/parameter_learning_smoke.yaml
        timeout-minutes: 10

      - name: Inference smoke
        run: nbn-bench inference --config nbn/bench/configs/synthetic/smoke_tests/inference_smoke.yaml
        timeout-minutes: 10

      - name: Upload smoke figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-figures
          path: results/**/*.png
          if-no-files-found: ignore

  # Executes every notebook in examples/ on the CPU. The outputs stored in the
  # notebooks are not compared, only that every cell runs without an error.
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[all,dev]"

      - name: Execute the example notebooks
        env:
          MPLBACKEND: Agg
        run: pytest --nbmake examples/

  # The documentation site (docs/, Sphinx). Read the Docs publishes it from
  # master; this job makes a broken page, a broken cross-reference or a bad
  # docstring fail the pull request instead of the next RTD build.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # CPU PyTorch is enough to import NBN for the API pages.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --prefer-binary -e ".[docs]"

      - name: Build the site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # Apple Silicon lane. GitHub's macos-latest runners are arm64 Macs with a
  # Metal-capable GPU, so ``torch.backends.mps.is_available()`` is True and
  # the device-parametrised tests (tests/conftest.py::available_devices)
  # run on ``mps`` for real -- the only place in CI that exercises the
  # float64-free accumulation paths and the CPU-hop linear solves.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Check environment
        # Prints the accelerator line: expected ``mps (Apple Metal; ...)``.
        run: nbn-bench check-env

      - name: Report MPS availability
        run: |
          python - <<'EOF'
          import torch
          from nbn.utils.device import resolve_device, accelerator_summary
          print("torch", torch.__version__)
          print("mps built:", torch.backends.mps.is_built(), "available:", torch.backends.mps.is_available())
          print("auto ->", resolve_device("auto"), "|", accelerator_summary())
          EOF

      - name: Test (fast gate)
        run: pytest -n auto

      - name: MPS tests without the CPU fallback
        # nbn/_mps_env.py defaults PYTORCH_ENABLE_MPS_FALLBACK=1 so that
        # third-party ops missing on Metal run on the CPU.  NBN's own kernels
        # must not depend on it: with the fallback off, an op without an MPS
        # kernel raises instead of silently running on the CPU.
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: pytest -n auto -m mps

      - name: Inference smoke on the default device (mps when available)
        run: nbn-bench inference --config nbn/bench/configs/synthetic/smoke_tests/inference_smoke.yaml --device auto
        timeout-minutes: 15
