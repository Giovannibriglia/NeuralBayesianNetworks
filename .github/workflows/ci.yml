name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Lint
        run: ruff check nbn/ benchmarking/ tests/

      - name: Type-check core
        run: mypy nbn/core nbn/mechanisms

      - name: Test
        # Runs the slow-marked tests too. They were excluded because the suite
        # took ~25 minutes; with torch's per-worker thread pool pinned under
        # xdist (see tests/conftest.py) the whole thing is ~80s, so there is
        # no longer anything to buy by skipping them -- and `slow` had become
        # "never runs anywhere", since this was the only workflow.
        run: pytest -n auto --cov=nbn --cov-report=xml -m "not gpu"

      - name: Parameter-learning smoke
        run: nbn-bench param-learning --config benchmarking/configs/synthetic/smoke_tests/parameter_learning_smoke.yaml
        timeout-minutes: 10

      - name: Inference smoke
        run: nbn-bench inference --config benchmarking/configs/synthetic/smoke_tests/inference_smoke.yaml
        timeout-minutes: 10

      - name: Upload smoke figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-figures-py${{ matrix.python-version }}
          path: benchmarking/figures/*.png
          if-no-files-found: ignore

      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
