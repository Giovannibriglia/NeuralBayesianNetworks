name: CI

# Lanes (markers are declared in pyproject.toml, wired in tests/conftest.py):
#
#   test        Linux CPU, py3.10-3.12   the fast gate = pytest's default
#                                         selection (not slow / subprocess /
#                                         network / perf / cuda / multi_gpu)
#   bench       Linux CPU, py3.12        slow + subprocess tests (real cell
#                                         workers, the nbn-bench CLI) and the
#                                         benchmark smoke runs
#   network     Linux CPU, py3.12        tests that may download bnlearn
#                                         networks, with the cache restored
#   macos       macOS arm64 (MPS)        the fast gate on a real Metal device,
#                                         then the mps-marked tests with the
#                                         CPU fallback disabled
#
# CUDA (self-hosted) and the nightly full run live in gpu.yml / nightly.yml.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Check environment
        # The resolver's picks must satisfy the versions the adapters are
        # written against (nbn/bench/_env.py mirrors pyproject.toml).
        run: nbn-bench check-env

      - name: Lint
        run: ruff check nbn/ tests/ notebooks/ scripts/

      - name: Type-check core
        run: mypy nbn/core nbn/mechanisms

      - name: Test (fast gate)
        # The default selection; torch's thread pool is pinned per xdist
        # worker in tests/conftest.py.
        run: pytest -n auto --cov=nbn --cov-report=xml

      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Slow and subprocess tests
        # Excludes the network / perf / device lanes; loadgroup honours any
        # xdist_group a test declares.
        run: >
          pytest -n auto --dist loadgroup
          -m "(slow or subprocess) and not network and not perf and not cuda and not multi_gpu"

      - name: Parameter-learning smoke
        run: nbn-bench param-learning --config nbn/bench/configs/synthetic/smoke_tests/parameter_learning_smoke.yaml
        timeout-minutes: 10

      - name: Inference smoke
        run: nbn-bench inference --config nbn/bench/configs/synthetic/smoke_tests/inference_smoke.yaml
        timeout-minutes: 10

      - name: Upload smoke figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-figures
          path: results/**/*.png
          if-no-files-found: ignore

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore bnlearn network cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nbn/bnlearn
          key: bnlearn-${{ hashFiles('nbn/bench/problems/bnlearn.py') }}
          restore-keys: bnlearn-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Network tests (bnlearn downloads)
        run: pytest -n auto -m "network and not perf and not cuda and not multi_gpu"

  # Apple Silicon lane. GitHub's macos-latest runners are arm64 Macs with a
  # Metal-capable GPU, so ``torch.backends.mps.is_available()`` is True and
  # the device-parametrised tests (tests/conftest.py::available_devices)
  # run on ``mps`` for real -- the only place in CI that exercises the
  # float64-free accumulation paths and the CPU-hop linear solves.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Check environment
        # Prints the accelerator line: expected ``mps (Apple Metal; ...)``.
        run: nbn-bench check-env

      - name: Report MPS availability
        run: |
          python - <<'EOF'
          import torch
          from nbn.utils.device import resolve_device, accelerator_summary
          print("torch", torch.__version__)
          print("mps built:", torch.backends.mps.is_built(), "available:", torch.backends.mps.is_available())
          print("auto ->", resolve_device("auto"), "|", accelerator_summary())
          EOF

      - name: Test (fast gate)
        run: pytest -n auto

      - name: MPS tests without the CPU fallback
        # nbn/_mps_env.py defaults PYTORCH_ENABLE_MPS_FALLBACK=1 so that
        # third-party ops missing on Metal run on the CPU.  NBN's own kernels
        # must not depend on it: with the fallback off, an op without an MPS
        # kernel raises instead of silently running on the CPU.
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: pytest -n auto -m mps

      - name: Inference smoke on the default device (mps when available)
        run: nbn-bench inference --config nbn/bench/configs/synthetic/smoke_tests/inference_smoke.yaml --device auto
        timeout-minutes: 15
