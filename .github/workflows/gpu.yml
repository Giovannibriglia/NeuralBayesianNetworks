name: gpu

# CUDA lane, on a self-hosted Linux runner with NVIDIA GPU(s) (register it
# with the labels self-hosted, linux, gpu).  It never runs on push or pull
# requests, so a missing runner can never block a PR: it is started by hand
# (e.g. before a release) or by the weekly schedule, and a scheduled run
# simply queues until such a runner is online.
#
# Selection: the cuda / multi_gpu tests (they skip cleanly with fewer
# devices) plus the slow suite, whose default device resolves to cuda here.
# tests/conftest.py gives each xdist worker its own GPU via
# CUDA_VISIBLE_DEVICES unless the scheduler (SLURM) already set it.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 0"   # Sundays 04:00 UTC

jobs:
  cuda:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev,bench,neural,gp,mcmc]"

      - name: Report devices
        run: |
          . .venv/bin/activate
          nvidia-smi -L || true
          python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.device_count())"

      - name: CUDA and slow tests
        run: |
          . .venv/bin/activate
          n_gpus=$(python -c "import torch; print(max(1, torch.cuda.device_count()))")
          pytest -n "$n_gpus" -m "cuda or multi_gpu or (slow and not network and not perf)"

      - name: Inference smoke on cuda
        run: |
          . .venv/bin/activate
          nbn-bench inference --config nbn/bench/configs/synthetic/smoke_tests/inference_smoke.yaml --device auto
        timeout-minutes: 15
