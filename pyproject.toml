[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralbayesiannetworks"
dynamic = ["version"]
description = "PyTorch-native Bayesian Networks with neural mechanisms and GPU-batched inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Giovanni Briglia" }]
keywords = ["bayesian-network", "probabilistic-ml", "pytorch", "causal-inference", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "opt-einsum>=3.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
bench = [
    "pgmpy>=0.1.25",
    "pomegranate>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.28",
    "filelock>=3.13",
    "psutil>=5.9",
]
neural = ["zuko>=1.2,<2.0"]
gp = ["gpytorch>=1.11"]
mcmc = ["pyro-ppl>=1.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6,<1.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "sphinx>=7.0",
    "furo>=2024.1",
    "nbsphinx>=0.9",
    "myst-parser>=2.0",
    "ipykernel>=6.0",
]

[project.scripts]
nbn-bench = "benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nbn*", "benchmarking*"]

[tool.setuptools.package-data]
"benchmarking" = ["configs/*.yaml"]

[tool.setuptools_scm]
write_to = "nbn/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["gpu: requires CUDA GPU", "slow: slow test skipped in fast CI"]

[tool.coverage.run]
source = ["nbn"]
omit = ["nbn/_version.py"]

[tool.coverage.report]
fail_under = 60
