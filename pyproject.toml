[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nbn"
dynamic = ["version"]
description = "PyTorch-native Bayesian Networks with neural mechanisms and GPU-batched inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Giovanni Briglia" }]
maintainers = [{ name = "Giovanni Briglia" }]
keywords = ["bayesian-network", "probabilistic-ml", "pytorch", "causal-inference", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core = what ``import nbn`` needs. Everything the benchmark suite
# (``nbn.bench`` / ``nbn-bench``) pulls in on top lives in the ``bench`` extra.
dependencies = [
    "torch>=2.2",
    "networkx>=3.0",
    "numpy>=1.24",
    "opt-einsum>=3.3",
]

[project.optional-dependencies]
bench = [
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pgmpy>=0.1.25",
    "pomegranate>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "psutil>=5.9",
]
neural = ["zuko>=1.2,<2.0"]
gp = ["gpytorch>=1.11"]
mcmc = ["pyro-ppl>=1.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6,<1.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "sphinx>=7.0",
    "furo>=2024.1",
    "nbsphinx>=0.9",
    "myst-parser>=2.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/Giovannibriglia/NeuralBayesianNetworks"
Repository = "https://github.com/Giovannibriglia/NeuralBayesianNetworks"
Issues = "https://github.com/Giovannibriglia/NeuralBayesianNetworks/issues"
Changelog = "https://github.com/Giovannibriglia/NeuralBayesianNetworks/releases"

[project.scripts]
nbn-bench = "nbn.bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nbn*"]

[tool.setuptools.package-data]
# YAML configs + bnlearn network JSONs ship inside the wheel so that
# ``nbn-bench --config`` and the bnlearn problem source work from a plain
# ``pip install "nbn[bench]"``, not only from a checkout.
"nbn.bench" = ["configs/**/*.yaml", "data/bnlearn/*.json"]

[tool.setuptools_scm]
write_to = "nbn/_version.py"
# v0.6c-d tag is the paper-data anchor at commit 2e0dd32 but is not
# PEP 440 compliant (bare ``c`` + ``-d`` suffix); packaging.version.Version
# rejects it across all setuptools-scm releases.  Capture only the leading
# numeric portion so v0.6c-d resolves to 0.6 and setuptools-scm bumps to
# 0.7.dev{N}+g{SHA} for installs.  Tag itself stays intact in git/docs/paper.
tag_regex = "^v(?P<version>\\d+\\.\\d+(?:\\.\\d+)?)"
# Version reported when no tag is reachable.  This is the load-bearing half for
# anyone vendoring the library: setuptools-scm derives the version from the
# nearest tag, so a shallow or tagless clone -- exactly what a vendored
# snapshot usually is -- falls back to its default 0.1.dev{N}. Two snapshots
# then report versions ordered by *clone depth* rather than by commit, which is
# how a later commit came to look older than an earlier one downstream. Pinning
# the fallback makes that case obviously-unknown instead of plausibly-wrong.
fallback_version = "0.14.0.dev0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["gpu: requires CUDA GPU", "slow: slow test skipped in fast CI"]

[tool.coverage.run]
source = ["nbn"]
# The coverage gate measures the library; the benchmark suite under nbn/bench
# is exercised by its own tests but is not what the threshold is about.
omit = ["nbn/_version.py", "nbn/bench/*"]

[tool.coverage.report]
fail_under = 60
