# =============================================================================
# synthetic scalability complete — Phase 3 paper §5 source data.
# =============================================================================
#
# Schema reference (benchmarking/core/yaml_config.py):
#
# Top-level (RunnerConfig):
#   version                   required, must be "v0.13"
#   benchmark                 required, "bnlearn" | "synthetic"
#   config_name               required, used as the output-artifact prefix
#   metrics                   default: "all"  ("all" | "timing")
#   selector                  default: "uniform_random"
#                             ("uniform_random" | {type: topological, ...}
#                              | {type: heaviest_by_role, ...})
#   source                    required, see below
#   baselines                 required, non-empty list of baseline specs
#   n_queries_per_cell        required
#   per_cell_timeout_s        required (seconds)
#   fit_timeout_s             default: null (computed = multiplier * per_cell_timeout_s)
#
# Source (synthetic):
#   families             required, list
#                        (discrete | continuous_lg | continuous_nongauss | hybrid)
#   n_nodes_list         required, list of int node counts
#   seeds                required, list of int RNG seeds
#   n_train              required
#   n_test               default: 2000
#   n_reference          required
#   edge_density         required
#   max_in_degree        required
#   cardinality          required
#   fraction_continuous  required
#   device               default: "cpu"
#
# Baseline spec (each item in `baselines`):
#   library, mechanism, param_method        (required)
#   inference_method, device, extra_kwargs   (optional)
# =============================================================================

# Scalability benchmark — paper §5 source data (Phase 3).
#
# Measures query-time vs n_nodes per (baseline, family, evidence_mode) using
# the HeaviestQueryByRole selector. Timeouts and OOMs at large n are expected
# outcomes recorded as status, not failures (design doc §7.2).
#
# WARNING: full grid is ~14-30h wall-clock worst case. NOT run in CI.
#
# Design: docs/phase3-design-draft.md §7.1.
#
# Note: the design doc writes the third family as "continuous_non_lg"; the
# canonical family string in this codebase is "continuous_nongauss" (matches
# inference_scalability.yaml and the v0.13 parquet schema).
version: "v0.13"
benchmark: synthetic
config_name: scalability_complete
metrics: all

selector:
  type: heaviest_by_role
  # Deterministic; emits a fixed query count per DAG (up to 12; 8 if no
  # articulation points). Ignores n_queries_per_cell.

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000]
  seeds: [0, 1, 2, 3, 4]
  n_train: 4096
  n_test: 1024
  n_reference: 10000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  # nbn-cat (discrete)
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 100,  n_samples: 1024 }}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # nbn-neuralcat (discrete)
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # nbn-lg (continuous_lg)
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # nbn-mdn (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # nbn-flow (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # Non-parametric -lw baselines (#228). TWO distinct cost mechanisms gate these
  # at scale (PR 10 GPU cost probe on continuous_lg = worst case, all nodes
  # continuous), each tripping a different budget:
  #   - kde / knn: per-QUERY cost trips per_cell_timeout_s=60 (the QUERY budget).
  #     kde query is O(n_nodes x n_train x n_samples); its 12-query time is ~32s
  #     at n_nodes=1000, so kde query-times-out around n_nodes ~2000. knn is
  #     ~5x cheaper per query -> wall around n_nodes ~8000.
  #   - flexcode: per-FIT cost trips fit_timeout_s=1200 (the FIT budget); its
  #     queries stay cheap. The 200-epoch MLP per continuous node makes fit ~154s
  #     at n_nodes=1000, walling around n_nodes ~7000.
  # Cells past each wall emit status=timeout — that IS the scalability finding
  # (where each non-parametric estimator stops scaling), not a config error.
  - {library: nbn,         mechanism: kde,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}, device: cuda}
  - {library: nbn,         mechanism: knn,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}, device: cuda}
  - {library: nbn,         mechanism: flexcode,  param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 1024}, device: cuda}
  # nbn-hybrid (hybrid router)
  - {library: nbn,         mechanism: hybrid,    param_method: mle, inference_method: router,    extra_kwargs: {epochs: 100,  n_samples: 1024}}
  # other libraries
  - {library: pomegranate, mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pyro,        mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}
  - {library: pgmpy,       mechanism: discrete,  param_method: mle,   inference_method: ve}
  - {library: pgmpy,       mechanism: discrete,  param_method: bayes, inference_method: ve}
  - {library: pgmpy,       mechanism: lg,        param_method: lg,    inference_method: predict}

# Ignored by heaviest_by_role; required by the loader.
n_queries_per_cell: 12
per_cell_timeout_s: 60.0
fit_timeout_s: 1200.0