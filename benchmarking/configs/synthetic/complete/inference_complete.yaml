# =============================================================================
# synthetic inference complete — paper-grade (server, >=16 GB VRAM or CPU).
# =============================================================================
#
# Schema reference (benchmarking/core/yaml_config.py):
#
# Top-level (RunnerConfig):
#   version                   required, must be "v0.13"
#   benchmark                 required, "bnlearn" | "synthetic"
#   config_name               required, used as the output-artifact prefix
#   metrics                   default: "all"  ("all" | "timing")
#   selector                  default: "uniform_random"
#                             ("uniform_random" | {type: topological, ...}
#                              | {type: heaviest_by_role, ...})
#   source                    required, see below
#   baselines                 required, non-empty list of baseline specs
#   n_queries_per_cell        required
#   per_cell_timeout_s        required (seconds)
#   fit_timeout_s             default: null (computed = multiplier * per_cell_timeout_s)
#
# Source (synthetic):
#   families             required, list
#                        (discrete | continuous_lg | continuous_nongauss | hybrid)
#   n_nodes_list         required, list of int node counts
#   seeds                required, list of int RNG seeds
#   n_train              required
#   n_test               default: 2000
#   n_reference          required
#   edge_density         required
#   max_in_degree        required
#   cardinality          required
#   fraction_continuous  required
#   device               default: "cpu"
#
# Baseline spec (each item in `baselines`):
#   library, mechanism, param_method        (required)
#   inference_method, device, extra_kwargs   (optional)
# =============================================================================

# Paper-grade config for inference.
# ~15-20 h on a CUDA server; ~30-50 h on CPU-only.
version: "v0.13"
benchmark: synthetic
config_name: complete
metrics: all
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss]
  n_nodes_list: [10, 20, 50, 100, 200, 500, 1000, 5000, 10000, 20000]
  seeds: [0, 1, 2, 3, 4]
  n_train: 20480
  n_test: 4096
  n_reference: 50000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  # nbn-cat (discrete)
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # nbn-neuralcat (discrete)
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # nbn-lg (continuous_lg)
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # nbn-mdn (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # nbn-flow (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # nbn-hybrid (hybrid router)
  - {library: nbn,         mechanism: hybrid,    param_method: mle, inference_method: router, extra_kwargs: {epochs: 100,  n_samples: 2048}}
  # Non-parametric continuous mechanisms (#224 / PR 9) — LW only (ais/avi blocked
  # at recognition_net._head_for, deferred to #227). All three carry device: cuda:
  # KDE-lw's per-query O(n_train) density eval is ~19.5s/query on CPU at this scale
  # (n_train=10000, n_samples=4096) -> ~5.5h/cell at n_queries_per_cell=1024;
  # 0.24s/query on GPU. Scalability/speed configs deferred to #228.
  - { library: nbn,   mechanism: kde,      param_method: mle,   inference_method: lw,      extra_kwargs: { n_samples: 2048 }, device: cuda }
  - { library: nbn,   mechanism: knn,      param_method: mle,   inference_method: lw,      extra_kwargs: { n_samples: 2048 }, device: cuda }
  - { library: nbn,   mechanism: flexcode, param_method: mle,   inference_method: lw,      extra_kwargs: { n_samples: 2048 }, device: cuda }
  # other libraries
  - {library: pomegranate, mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pyro,        mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}
  - {library: pgmpy,       mechanism: discrete,  param_method: mle,   inference_method: ve}
  - {library: pgmpy,       mechanism: discrete,  param_method: bayes, inference_method: ve}
  - {library: pgmpy,       mechanism: lg,        param_method: lg,    inference_method: predict}

n_queries_per_cell: 128
per_cell_timeout_s: 1200.0
fit_timeout_s: 1200