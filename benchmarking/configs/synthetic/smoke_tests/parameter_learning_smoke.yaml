# =============================================================================
# synthetic parameter-learning smoke (held-out joint log-likelihood; #109).
# =============================================================================
#
# Schema reference (benchmarking/core/yaml_config.py):
#
# Top-level (RunnerConfig):
#   version                   required, must be "v0.13"
#   benchmark                 required, "bnlearn" | "synthetic"
#   config_name               required, used as the output-artifact prefix
#   metrics                   default: "all"  ("all" | "timing");
#                             param-learning configs MUST set "log_likelihood"
#   selector                  default: "uniform_random"
#                             ("uniform_random" | {type: topological, ...}
#                              | {type: heaviest_by_role, ...})
#   source                    required, see below
#   baselines                 required, non-empty list of baseline specs
#   n_queries_per_cell        required
#   per_cell_timeout_s        required (seconds)
#   fit_timeout_s             default: null (computed = multiplier * per_cell_timeout_s)
#
# Source (synthetic):
#   families             required, list
#                        (discrete | continuous_lg | continuous_nongauss | hybrid)
#   n_nodes_list         required, list of int node counts
#   seeds                required, list of int RNG seeds
#   n_train              required
#   n_test               default: 2000
#   n_reference          required
#   edge_density         required
#   max_in_degree        required
#   cardinality          required
#   fraction_continuous  required
#   device               default: "cpu"
#
# Baseline spec (each item in `baselines`):
#   library, mechanism, param_method        (required)
#   inference_method, device, extra_kwargs   (optional)
# =============================================================================

# Smoke config for parameter learning.
# Run with: nbn-bench param-learning --config <this file>
# The param-learning command scores each fitted model's held-out joint
# log-likelihood on problem.test_data (ParamLearningMeasurement, #109) and
# requires metrics: log_likelihood. Adapters that do not implement scoring
# (supports_scoring unset) are reported status="not_supported".
version: "v0.13"
benchmark: synthetic
config_name: param_learning_smoke
metrics: log_likelihood
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [5, 10]
  seeds: [0]
  n_train: 2048
  n_test: 512
  n_reference: 5000
  edge_density: 0.20
  max_in_degree: 2
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy,       mechanism: discrete, param_method: mle}
  - {library: pgmpy,       mechanism: discrete, param_method: bayes}
  - {library: pgmpy,       mechanism: lg,       param_method: mle}
  - {library: pomegranate, mechanism: discrete, param_method: mle}
  - {library: pyro,        mechanism: empirical, param_method: mle}
  - {library: nbn,   mechanism: cat,      param_method: mle}
  - {library: nbn,   mechanism: neuralcat, param_method: mle}
  - {library: nbn,   mechanism: lg,       param_method: mle}
  - {library: nbn,   mechanism: mdn,      param_method: mle}
  - {library: nbn,   mechanism: flow,     param_method: mle}
  - {library: nbn,   mechanism: hybrid,   param_method: mle}
  # Non-parametric continuous baselines (#223 / PR 8). KDE + KNN only — both are
  # sub-second per node on CPU. FlexCode (200-epoch MLP, CPU-intractable) is
  # complete-config / GPU only.
  - {library: nbn,   mechanism: kde,      param_method: mle}
  - {library: nbn,   mechanism: knn,      param_method: mle}

n_queries_per_cell: 2
per_cell_timeout_s: 60.0
