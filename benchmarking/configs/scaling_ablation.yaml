# Network-size scaling ablation (v0.3 page-2 figure).
# Vary n_nodes only, keep density and cardinality fixed.
domain: synthetic_hybrid_scaling
problems:
  - hybrid_n10_d020_k4_r0
  - hybrid_n10_d020_k4_r1
  - hybrid_n50_d020_k4_r0
  - hybrid_n50_d020_k4_r1
  - hybrid_n100_d020_k4_r0
  - hybrid_n100_d020_k4_r1
  - hybrid_n200_d020_k4_r0
  - hybrid_n200_d020_k4_r1
n_train: 1000
n_test: 200
seed: 0
devices: [cpu]
baselines: [nbn_lw, nbn_hybrid, nbn_linear_gaussian]
mode: parameter_learning
measure_fit_time: true
query_kinds: [marginal]
output: results/scaling_ablation.parquet
