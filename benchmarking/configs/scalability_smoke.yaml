# Scalability smoke — Phase 3 HeaviestQueryByRole selector, fast CI check.
#
# Exercises the full Phase 3 pipeline (full + empty evidence modes) on a
# small grid so the parquet shape can be verified quickly. The paper-scale
# grid lives in scalability_paper.yaml.
#
# Design: docs/phase3-design-draft.md §7.1.
# Wall-clock budget: ~5-10 min on CPU.
version: "v0.13"
benchmark: synthetic
config_name: scalability_smoke
metrics: all

selector:
  type: heaviest_by_role
  # HeaviestQueryByRole is deterministic and emits a fixed query count per
  # DAG (up to 12; 8 if no articulation points). It ignores
  # n_queries_per_cell entirely — the field below is required by the loader
  # but has no effect on this selector.

source:
  families: [discrete, continuous_lg]
  n_nodes_list: [10, 50, 100]
  seeds: [0, 1]
  n_train: 1024
  n_test: 256
  n_reference: 2000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy,       mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pomegranate, mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pyro,        mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}
  - {library: nbn,         mechanism: hybrid,    param_method: mle, inference_method: router}

# Ignored by heaviest_by_role (see selector note above); required by the loader.
n_queries_per_cell: 12
per_cell_timeout_s: 30.0
fit_timeout_s_multiplier: 10.0
