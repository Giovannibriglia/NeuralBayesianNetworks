# Smoke config for inference — runs in CI on every push.
# Wall-clock budget: < 90 seconds on CPU.
version: "v0.13"
benchmark: synthetic
config_name: smoke
metrics: all
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [5, 10]
  seeds: [0]
  n_train: 2048
  n_test: 512
  n_reference: 5000
  edge_density: 0.20
  max_in_degree: 2
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy, mechanism: discrete, param_method: mle,   inference_method: ve}
  - {library: pgmpy, mechanism: discrete, param_method: bayes, inference_method: ve}
  - {library: pgmpy, mechanism: lg,       param_method: mle,   inference_method: predict}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: ve}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 1024}}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: ve}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: lw,      extra_kwargs: {n_samples: 1024}}
  - {library: nbn,   mechanism: lg,       param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 1024}}
  - {library: nbn,   mechanism: mdn,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 1024}}
  - {library: nbn,   mechanism: flow,     param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 1024}}
  - {library: nbn,   mechanism: hybrid,   param_method: mle,   inference_method: router}

n_queries_per_cell: 2
per_cell_timeout_s: 60.0
fit_timeout_s_multiplier: 10.0
