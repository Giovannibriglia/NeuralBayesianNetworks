# Scalability benchmark — measures the n_nodes ceiling per baseline under a
# 60s timeout.  Question: "at what n_nodes does the full cell pipeline
# overflow the per-cell budget?"
#
# IMPORTANT — what the cliff measures (issue #107, 2026-05-22):
#   per_cell_timeout_s wraps fit + queries + accuracy metrics.
#   The cliff therefore reflects "when do fit + BN generation overflow 60s",
#   not pure per-query scalability.  Per-query inference is much faster than
#   the cliff suggests.
#
# Design choices (empirically validated 2026-05-22, issue #105):
#   - 60s timeout: we want the cliff, not full timing data.
#   - Single seed: pass/fail is binary; more seeds add noise.
#   - Single query per cell: one inference call, not throughput.
#   - Small n_train (1024): training data is not the variable under test.
version: "v0.13"
benchmark: synthetic
config_name: scalability
metrics: timing
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]
  seeds: [0]
  n_train: 1024
  n_test: 256
  n_reference: 5000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy, mechanism: discrete, param_method: mle,   inference_method: ve}
  - {library: pgmpy, mechanism: discrete, param_method: bayes, inference_method: ve}
  - {library: pgmpy, mechanism: lg,       param_method: mle,   inference_method: predict}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: ve}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 512}}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: ve}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: lw,      extra_kwargs: {n_samples: 512}}
  - {library: nbn,   mechanism: lg,       param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 512}}
  - {library: nbn,   mechanism: mdn,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 512}}
  - {library: nbn,   mechanism: flow,     param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 512}}
  - {library: nbn,   mechanism: hybrid,   param_method: mle,   inference_method: router}
  - {library: gpytorch,    mechanism: gp,       param_method: mle, inference_method: predict}
  - {library: pomegranate, mechanism: discrete, param_method: mle, inference_method: ve}
  - {library: pyro, mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}

n_queries_per_cell: 1
per_cell_timeout_s: 60.0
fit_timeout_s_multiplier: 10.0
