# Paper-grade config for inference.
# ~15-20 h on a CUDA server; ~30-50 h on CPU-only.
version: "v0.13"
benchmark: synthetic
config_name: paper
metrics: all
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [10, 50, 100, 500, 1000]   # 5000 dropped (cuda OOM at 7.6 GiB)
  seeds: [0, 1, 2, 3, 4]
  n_train: 10240
  n_test: 1024
  n_reference: 50000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy, mechanism: discrete, param_method: mle,   inference_method: ve}
  - {library: pgmpy, mechanism: discrete, param_method: bayes, inference_method: ve}
  - {library: pgmpy, mechanism: lg,       param_method: mle,   inference_method: predict}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: ve}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 4096}}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: ve}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: lw,      extra_kwargs: {n_samples: 4096}}
  - {library: nbn,   mechanism: lg,       param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 4096}}
  - {library: nbn,   mechanism: mdn,      param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 4096}}
  - {library: nbn,   mechanism: flow,     param_method: mle,   inference_method: lw,      extra_kwargs: {n_samples: 4096}}
  - {library: nbn,   mechanism: hybrid,   param_method: mle,   inference_method: router}

  # Paper-only libraries.  Non-applicable cells are gated by is_applicable.
  # gpytorch: accuracy_supported=False per registry (#96); speed row emitted.
  - {library: gpytorch,    mechanism: gp,       param_method: mle,   inference_method: predict}
  - {library: pomegranate, mechanism: discrete, param_method: mle,   inference_method: ve}
  # device: cpu — pyro's Importance sampler is Python-bound; GPU ~10x slower
  # at benchmark scale (docs/audits/v0.12-pyro-gpu-investigation.md).
  - {library: pyro, mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}

n_queries_per_cell: 1024
per_cell_timeout_s: 600.0
fit_timeout_s_multiplier: 10.0
