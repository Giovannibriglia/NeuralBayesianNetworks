# Paper-grade config for inference. Run locally; ~30 min on CPU.
config_schema_version: 2

mode: inference
families: [discrete, continuous_lg, continuous_nongauss, hybrid]
n_nodes: [10, 50, 100, 500, 1000]   # 5000 dropped (cuda OOM at 7.6 GiB)
n_seeds: 5
n_queries_per_cell: 1024
nbn_batch_size: 1024
n_train: 10000
n_test: 1024                          # explicit per v0.6c-A audit (was silently 500)
n_reference: 50000
nbn_lw_n_samples: 4000
edge_density: 0.20
max_in_degree: 4
cardinality: 4
fraction_continuous: 0.5

# v0.6c-C-1b — full per-method baseline set, matching smoke.
# nbn-neuralcat-ve deferred to v0.7 issue #26.
baselines:
  - {library: pgmpy, mechanism: discrete, param_method: mle,   inference_method: ve}
  - {library: pgmpy, mechanism: discrete, param_method: bayes, inference_method: ve}
  - {library: pgmpy, mechanism: lg,       param_method: mle,   inference_method: predict}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: ve}
  - {library: nbn,   mechanism: cat,      param_method: mle,   inference_method: lw}
  - {library: nbn,   mechanism: neuralcat, param_method: mle,  inference_method: lw}
  - {library: nbn,   mechanism: lg,       param_method: mle,   inference_method: lw}
  - {library: nbn,   mechanism: mdn,      param_method: mle,   inference_method: lw}
  - {library: nbn,   mechanism: flow,     param_method: mle,   inference_method: lw}
  - {library: nbn,   mechanism: hybrid,   param_method: mle,   inference_method: router}

per_cell_timeout_s: 600
output_dir: benchmarking/results
output_prefix: inference_paper
