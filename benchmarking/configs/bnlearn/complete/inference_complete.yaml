# =============================================================================
# bnlearn inference complete — full 31-network paper-scale coverage.
# =============================================================================
#
# Schema reference (benchmarking/core/yaml_config.py):
#
# Top-level (RunnerConfig):
#   version                   required, must be "v0.13"
#   benchmark                 required, "bnlearn" | "synthetic"
#   config_name               required, used as the output-artifact prefix
#   metrics                   default: "all"  ("all" | "timing")
#   selector                  default: "uniform_random"
#                             ("uniform_random" | {type: topological, ...}
#                              | {type: heaviest_by_role, ...})
#   source                    required, see below
#   baselines                 required, non-empty list of baseline specs
#   n_queries_per_cell        required
#   per_cell_timeout_s        required (seconds)
#   fit_timeout_s_multiplier  default: 10.0
#   fit_timeout_s             default: null (computed = multiplier * per_cell_timeout_s)
#
# Source (bnlearn):
#   networks      required, list of bnlearn network names
#   seeds         required, list of int RNG seeds
#   n_train       default: 5000
#   n_test        default: 1000
#   n_reference   default: 5000
#
# Baseline spec (each item in `baselines`):
#   library, mechanism, param_method        (required)
#   inference_method, device, extra_kwargs   (optional)
# =============================================================================

# Bnlearn paper-scale benchmark — full network coverage.
#
# All 31 networks across three kinds (24 discrete + 4 Gaussian + 3 CLG),
# 5 seeds, TopologicalAllocator selector, generous per-cell budget.
#
# This config produces paper §5 source data for the real-network arm
# of the v0.13 benchmark. It complements scalability_paper.yaml (synthetic
# scalability arm).
#
# WARNING: full run is multi-day wall-clock. Massive discrete networks
# (munin*, link at 724-1041 nodes) will have many timeout rows; that's
# expected outcome, recorded as status, not failure.
#
# Design: docs/phase4-design-draft.md §3, §6.
version: "v0.13"
benchmark: bnlearn
config_name: bnlearn_complete
metrics: all

source:
  networks:
    # Discrete — small
    - asia
    - cancer
    - earthquake
    - sachs
    - survey
    # Discrete — medium
    - alarm
    - barley
    - child
    - insurance
    - mildew
    - water
    # Discrete — large
    - hailfinder
    - hepar2
    - win95pts
    # Discrete — very large
    - andes
    - diabetes
    - link
    - munin1
    - pathfinder
    - pigs
    # Discrete — massive
    - munin
    - munin2
    - munin3
    - munin4
    # Gaussian
    - ecoli70
    - magic-niab
    - magic-irri
    - arth150
    # CLG
    - healthcare
    - sangiovese
    - mehra
  seeds: [0, 1, 2, 3, 4]
  n_train: 10240
  n_test: 1024
  n_reference: 10240

selector:
  type: topological
  target_allocation:
    hub: 0.30
    cut: 0.25
    terminal: 0.25
    random: 0.20

n_queries_per_cell: 256

baselines:
  - {library: pgmpy,       mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pgmpy,       mechanism: lg,        param_method: lg,  inference_method: predict}
  - {library: pomegranate, mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pyro,        mechanism: empirical, param_method: mle, inference_method: importance, device: cpu}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ve}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: lw}
  - {library: nbn,         mechanism: hybrid,    param_method: mle, inference_method: router}

per_cell_timeout_s: 120
