# v0.4 crash-test full-sweep config — paper-grade run.
#
# Used by:
#   nbn-bench param-learning --config benchmarking/configs/crash_test_full.yaml
#   nbn-bench inference       --config benchmarking/configs/crash_test_full.yaml
#
# Estimated wall time: ≈30 minutes on CPU and ≈10 minutes on a single GPU
# for parameter-learning; ≈45 minutes on CPU and ≈15 minutes on GPU for
# inference.  See examples/crash_test_parameter_learning.py and
# examples/crash_test_inference.py (landing in v0.4b) for the runners
# that consume this file.
#
# Implementation lands in v0.4b (PR-2).  v0.4a wires the entry point so
# the same YAML works for both PR-1's stub command and PR-2's real run.

# Network sizes to sweep.  ``--extended`` adds 10000.
sizes: [10, 50, 100, 500, 1000, 5000]

families:
  - discrete
  - continuous_lg
  - continuous_nongauss
  - hybrid

# Three seeds gives mean ± std error bands on every figure.
seeds: [0, 1, 2]

generator:
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5
  n_train: 10000
  n_test: 2000
  n_reference: 50000

inference:
  batch_size: 1024
  n_warmup: 5
  n_repeat: 5
  per_cell_timeout_s: 300

output_dir: examples/figures
