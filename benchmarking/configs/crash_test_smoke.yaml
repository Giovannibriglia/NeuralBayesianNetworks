# v0.4 crash-test smoke config — fast pipeline-validation run.
#
# Used by:
#   nbn-bench param-learning --config benchmarking/configs/crash_test_smoke.yaml
#   nbn-bench inference       --config benchmarking/configs/crash_test_smoke.yaml
#
# Hard rule for smoke: every cell must complete in <90s on a single CPU.
# The numbers below were tuned in PR #12 §1/§2 to clear two specific gates:
# (a) discrete TV ≤ 0.05 for both NBN and pgmpy (escape sampling-noise floor);
# (b) nbn_ve elimination on n=50 discrete with K=4 produces unmanageable
#     intermediate factors and pegs a CPU core for >120s, which Python's
#     SIGALRM can't interrupt because the work happens in tight C/torch
#     loops — so we either drop K or drop n=50 from sizes.  We picked K=2
#     and kept n_max=50 so the n-axis still spans a useful order of
#     magnitude on the smoke figure.

# Network sizes to sweep on the x-axis.
sizes: [10, 50]

# Synthetic-generator families to evaluate.  Set in the order the figure
# panels render (top-left, top-middle, top-right, bottom-left).
families:
  - discrete
  - continuous_lg
  - continuous_nongauss
  - hybrid

# Replicate count per (family, size) cell.  Smoke uses a single seed.
seeds: [0]

# Generator parameters.
generator:
  edge_density: 0.20
  max_in_degree: 4
  # K=2 for smoke: keeps nbn_ve's elimination treewidth manageable at
  # n=50 (intermediate factor magnitudes ~ K^width).  Full-config uses K=4.
  cardinality: 2
  fraction_continuous: 0.5
  # PR #12 §1: escape the sampling-noise floor so the figure isn't
  # dominated by RNG.  At n_train=200 + cardinality=4 we saw TV ≈ 0.20–0.40
  # on discrete (paper claims TV ≤ 0.01 against pgmpy); bumping to 2000
  # rows brings it under the 0.05 acceptance gate while still completing
  # within budget.
  n_train: 2000
  n_test: 200
  n_reference: 1000

# Inference-crash-test only: fixed batch size for NBN.
inference:
  batch_size: 1024
  n_warmup: 2
  n_repeat: 2
  # 90s per-cell soft cap.  In practice cells finish in 1–5s each at the
  # current sizes; the cap is a safety net for hangs in wrapped libraries
  # that don't yield to SIGALRM (pgmpy LinearGaussianBayesianNetwork's
  # add_cpds is the known offender; pgmpy is excluded from inference smoke
  # for this reason — tracked for v0.4c).
  per_cell_timeout_s: 90
  # Bumped from 20 → 50 epochs alongside n_train so MDN-bearing cells
  # actually converge enough to be measurable.
  smoke_epochs: 50

# Parquet output root.  Figures always land under examples/figures/.
output_dir: examples/figures/v04_smoke
