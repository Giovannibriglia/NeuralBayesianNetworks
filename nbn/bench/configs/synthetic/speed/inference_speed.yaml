# =============================================================================
# batch_speed benchmark — paper-scale batched-queries sweep (#148).
# =============================================================================
#
# Design: docs/v0.14-batched-queries-design.md §5 (LOCKED 2026-06-07).
#
#   - Synthetic only, n=100 per family (§5.1), 5 seeds (§5.5)
#   - n_batch_queries: 10240 evidence-value variants per query position,
#     uniform across baselines (§5.3)
#   - batch_sizes sweep [1, 8, 32, 128, 512, 1024] (§5.4): baselines whose
#     adapters support batching (nbn-*, pomegranate-*) run once per sweep
#     value; pinned baselines (pyro-*, pgmpy-*, batch_size: 1) run once
#     total on the first pass (§5.6)
#   - metrics: timing — TimingOnly, no accuracy scoring
#
# Batchable engines (v0.14): VE, LW, AIS (#181/#184), AVI (#182/#186). All
# four nbn engines follow the batch_sizes sweep. AIS and AVI share LW's
# accuracy class and applicable families (core/applicability.py) — AIS is LW
# with a learned proposal; AVI is a bounded-ELBO amortized engine.
#
# Known risk (§5.3 / §8.1): non-batchable baselines process 10240 queries
# sequentially per cell. At ~10s/query (pyro on n=100 continuous) the
# 600s per-cell budget forces a soft timeout after ~60 queries → DNF
# sentinel rows. This is documented expected behavior, not a bug: their
# figure lines show as flat B=1 references where they complete and DNF
# where they don't.
#
# Compute budget (§5.7): 23 baselines → 460 (baseline × family × seed) cells,
# of which ~185 are applicable and yield ~960 timing measurements across the
# batch_sizes sweep. Adding Engines A/B (AIS, AVI) roughly DOUBLED the
# applicable-cell count vs the original VE/LW-only spec (95 → 185 cells,
# 420 → 960 measurement rows). Hours of wall-clock — a real run, not CI.
# See inference_speed_smoke.yaml for the fast gate.
# =============================================================================
# Training minibatch for every nbn baseline below (extra_kwargs.batch_size).
# Defined once here as a YAML anchor and referenced as *BATCH_SIZE_FIT.
BATCH_SIZE_FIT: &BATCH_SIZE_FIT 1024

version: "v0.14"
benchmark: synthetic
config_name: batch_speed
metrics: timing

batch_sizes: [1, 128, 512, 1024]
n_batch_queries: 1024

source:
  families: [discrete, continuous_lg, continuous_nongauss, hybrid]
  n_nodes_list: [50]
  seeds: [0, 1, 2, 3, 4]
  n_train: 4096        # 2x n_batch_queries: variant sampling without replacement
  n_test: 1024
  n_reference: 10000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

selector:
  type: heaviest_by_role
  # n_batch_queries comes from the top-level field above.

# Baselines: all applicable per family (§5.2); inapplicable (baseline,
# family) cells emit not_supported rows via is_applicable, as everywhere.
# Batchable (no explicit batch_size — follows the sweep): nbn-*, pomegranate.
# Non-batchable (batch_size: 1 pinned — runs once): pyro-*, pgmpy-*.
# Grouped by mechanism, then engine (ve, lw, ais, avi).
#
# extra_kwargs: {epochs: 2} caps neural-mechanism training at 2 epochs for
# speed (the adapter reads kwargs["epochs"]; omitted = each mechanism's own
# designed budget — nbn_adapter.py).
# Harmless no-op on closed-form mechanisms (cat tabular MLE, lg). NOTE: the
# probe used {fit_epochs:2}, which was a double no-op — malformed YAML key
# AND the adapter reads `epochs`, not `fit_epochs` — so it silently ran 20
# epochs. {epochs: 2} is the corrected form that actually caps fitting.
#
#   extra_kwargs.batch_size (nbn only) is the TRAINING minibatch — distinct
#     from the per-baseline top-level `batch_size:` (query-batch pin) and the
#     top-level `batch_sizes:` sweep above. It is the minibatch size for the SGD-trained
#     mechanisms (neuralcat, mdn, flow, flexcode). Set once via the top-level
#     BATCH_SIZE_FIT anchor and referenced as *BATCH_SIZE_FIT; omitted -> each
#     mechanism's own default (512). Closed-form mechanisms (cat, cat-bayes,
#     lg, kde, knn) ignore it. It is part of the fit-once cache identity
#     (runner._fit_identity), so keep it identical across baselines that
#     should share a fit.
baselines:
  # nbn-cat (discrete)
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # nbn-neuralcat (discrete)
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ve,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: neuralcat, param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # nbn-lg (continuous_lg)
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: lg,        param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # nbn-mdn (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: mdn,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # nbn-flow (continuous_lg / continuous_nongauss / hybrid)
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: ais,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  - {library: nbn,         mechanism: flow,      param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # Non-parametric -lw baselines (#228) — n_samples=16 makes per-query latency
  # trivial; flexcode fit (~9s/cell at n_nodes=50) is well under per_cell_timeout.
  - {library: nbn,         mechanism: kde,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}, device: cuda}
  - {library: nbn,         mechanism: knn,       param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}, device: cuda}
  - {library: nbn,         mechanism: flexcode,  param_method: mle, inference_method: lw,     extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}, device: cuda}
  # nbn-hybrid (hybrid router)
  - {library: nbn,         mechanism: hybrid,    param_method: mle, inference_method: router,    extra_kwargs: {epochs: 1,  batch_size: *BATCH_SIZE_FIT, n_samples: 16}}
  # other libraries
  - {library: pomegranate, mechanism: discrete,  param_method: mle, inference_method: ve}
  - {library: pyro,        mechanism: empirical, param_method: mle, inference_method: importance, batch_size: 1}
  - {library: pgmpy,       mechanism: discrete,  param_method: mle,   inference_method: ve, batch_size: 1}
  - {library: pgmpy,       mechanism: discrete,  param_method: bayes, inference_method: ve, batch_size: 1}
  - {library: pgmpy,       mechanism: lg,        param_method: lg,    inference_method: predict, batch_size: 1}

# n_queries_per_cell is ignored by heaviest_by_role (fixed up-to-12
# positions per DAG) but required by the schema.
n_queries_per_cell: 12
# Aggressive per-cell budget (§8.1): batchable baselines finish in
# seconds; sequential baselines at N=10240 hit this and DNF by design.
per_cell_timeout_s: 600.0
fit_timeout_s: 1200
