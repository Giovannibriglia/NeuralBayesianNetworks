# =============================================================================
# v0.19.0 partial rerun — discrete family, nbn-cat-avi only (AVI gate fix)
# =============================================================================
# Generated from synthetic/complete/inference_complete.yaml; every non-baseline setting and every kept baseline
# line is identical to it, so problems, seeds, queries and budgets match the
# original run cell for cell.
#
# Why: v0.19.0 fixed the continuous oracle (#288: it sampled p(T | do(E)),
# now p(T | E)) and the AVI quality gate (#286).  Continuous-target scores
# and every *-avi cell of runs made with <= v0.18.3 are stale; discrete-target
# scores of the other baselines and non-AVI timings are not.
#
# After the run, splice the new cells into the original parquet:
#   nbn-bench merge <complete run dir> <this run dir> -o <merged>.parquet
# then plot <merged>.parquet as usual.
# =============================================================================

BATCH_SIZE_FIT: &BATCH_SIZE_FIT 1024
version: "v0.13"
benchmark: synthetic
config_name: complete_rerun_discrete_avi
metrics: all
selector: uniform_random
source:
  families: [discrete]
  n_nodes_list: [10, 50, 100, 500, 1000]
  seeds: [0, 1, 2, 3, 4]
  n_train: 20480
  n_test: 4096
  n_reference: 50000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5
baselines:
  - {library: nbn,         mechanism: cat,       param_method: mle, inference_method: avi,    extra_kwargs: {epochs: 100,  batch_size: *BATCH_SIZE_FIT, n_samples: 2048}}
n_queries_per_cell: 128
per_cell_timeout_s: 1200.0
fit_timeout_s: 1200
