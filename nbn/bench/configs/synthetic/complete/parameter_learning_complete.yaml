# =============================================================================
# synthetic parameter-learning complete — paper-grade (held-out log-likelihood; #109).
# =============================================================================
#
# Schema reference (nbn/bench/core/yaml_config.py):
#
# Top-level (RunnerConfig):
#   version                   required, must be "v0.13"
#   benchmark                 required, "bnlearn" | "synthetic"
#   config_name               required, used as the output-artifact prefix
#   metrics                   default: "all"  ("all" | "timing");
#                             param-learning configs MUST set "log_likelihood"
#   selector                  default: "uniform_random"
#                             ("uniform_random" | {type: topological, ...}
#                              | {type: heaviest_by_role, ...})
#   source                    required, see below
#   baselines                 required, non-empty list of baseline specs
#   n_queries_per_cell        required
#   per_cell_timeout_s        required (seconds)
#   fit_timeout_s             default: null (computed = multiplier * per_cell_timeout_s)
#
# Source (synthetic):
#   families             required, list
#                        (discrete | continuous_lg | continuous_nongauss | hybrid)
#   n_nodes_list         required, list of int node counts
#   seeds                required, list of int RNG seeds
#   n_train              required
#   n_test               default: 2000
#   n_reference          required
#   edge_density         required
#   max_in_degree        required
#   cardinality          required
#   fraction_continuous  required
#   device               default: "cpu"
#
# Baseline spec (each item in `baselines`):
#   library, mechanism, param_method        (required)
#   inference_method, device, extra_kwargs   (optional)
#   extra_kwargs.batch_size (nbn only): minibatch size for the SGD-trained
#     mechanisms (neuralcat, mdn, flow, flexcode). Set once via the top-level
#     BATCH_SIZE_FIT anchor and referenced as *BATCH_SIZE_FIT; omitted -> each
#     mechanism's own default (512). Closed-form mechanisms (cat, cat-bayes,
#     lg, kde, knn) ignore it. It is part of the fit-once cache identity
#     (runner._fit_identity), so keep it identical across baselines that
#     should share a fit.
# =============================================================================

# Paper-grade config for parameter learning.
# Run with: nbn-bench param-learning --config <this file>
# The param-learning command scores each fitted model's held-out joint
# log-likelihood on problem.test_data (ParamLearningMeasurement, #109) and
# requires metrics: log_likelihood. Adapters that do not implement scoring
# (supports_scoring unset) are reported status="not_supported".
# Training minibatch for every nbn baseline below (extra_kwargs.batch_size).
# Defined once here as a YAML anchor and referenced as *BATCH_SIZE_FIT.
BATCH_SIZE_FIT: &BATCH_SIZE_FIT 1024

version: "v0.13"
benchmark: synthetic
config_name: param_learning_complete
metrics: log_likelihood
selector: uniform_random

source:
  families: [discrete, continuous_lg, continuous_nongauss]
  n_nodes_list: [10, 50, 100, 500, 1000]
  seeds: [0, 1, 2, 3, 4]
  n_train: 20480
  n_test: 4096
  n_reference: 50000
  edge_density: 0.20
  max_in_degree: 4
  cardinality: 4
  fraction_continuous: 0.5

baselines:
  - {library: pgmpy, mechanism: discrete, param_method: mle}
  - {library: pgmpy, mechanism: discrete, param_method: bayes}
  - {library: pgmpy, mechanism: lg,       param_method: mle}
  - {library: nbn,   mechanism: cat,      param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  # Laplace-smoothed (alpha=1) CPTs — the estimator class that wins recovery
  # TV/KL at paper scale (pyro/pgmpy-bayes precedent); mechanism pre-existed.
  - {library: nbn,   mechanism: cat-bayes, param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  #- {library: nbn,   mechanism: neuralcat, param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  - {library: nbn,   mechanism: lg,       param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  - {library: nbn,   mechanism: mdn,      param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  - {library: nbn,   mechanism: flow,     param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  # - {library: nbn,   mechanism: hybrid,   param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  # Non-parametric continuous baselines (#223 / PR 8) — parametric-vs-non-
  # parametric calibration comparison. KDE + KNN are cheap; flexcode trains a
  # 200-epoch MLP per continuous node, so it carries a per-baseline device: cuda
  # override (the global default stays CPU; mdn/flow are a separate device call).
  - {library: nbn,   mechanism: kde,      param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  - {library: nbn,   mechanism: knn,      param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}}
  - {library: nbn,   mechanism: flexcode, param_method: mle, extra_kwargs: {batch_size: *BATCH_SIZE_FIT}, device: cuda}
  # - {library: gpytorch,    mechanism: gp,       param_method: mle}
  - {library: pomegranate, mechanism: discrete, param_method: mle}
  - {library: pyro, mechanism: empirical, param_method: mle, device: cpu}

n_queries_per_cell: 12
per_cell_timeout_s: 1200.0
fit_timeout_s: 1200
