[mypy]
ignore_missing_imports = True
warn_unused_configs = False
show_error_codes = True
no_implicit_optional = True
warn_redundant_casts = True
strict_equality = True
# Only report errors in directly-checked dirs (nbn/core, nbn/mechanisms);
# transitive imports (nbn/inference, nbn/sampling, nbn/learning) are silenced
# until those modules get their own type-check pass in v0.3.
follow_imports = silent
# v0.2 type-check is targeted; broader checks tracked in a v0.3 issue.
disable_error_code = misc, union-attr, no-redef, assignment, arg-type, operator, return-value, return, attr-defined, var-annotated, valid-type, has-type, index, call-overload, call-arg, list-item

[mypy-networkx.*]
ignore_missing_imports = True

[mypy-opt_einsum.*]
ignore_missing_imports = True

[mypy-pgmpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-filelock.*]
ignore_missing_imports = True
